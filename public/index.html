<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PlaceTrack — Placement Training System</title>
<link rel="stylesheet" href="style.css"/>
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f1f5f9;overflow-x:hidden}
.login-wrapper{width:100%;max-width:420px;padding:20px}
.login-brand{text-align:center;margin-bottom:32px}
.login-brand .brand-logo{width:56px;height:56px;background:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px;color:white;box-shadow:0 4px 12px var(--primary-glow)}
.login-brand h1{font-size:24px;font-weight:800;color:var(--text)}
.login-brand p{color:var(--text-muted);font-size:14px;margin-top:4px}
.login-card{background:white;border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 10px 25px rgba(0,0,0,0.05)}
.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;background:#f8fafc;padding:4px;border-radius:10px;border:1px solid var(--border)}
.role-tab{padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-muted);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.role-tab.active{background:white;color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,0.05);border:1px solid var(--border)}
.demo-hint{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:12px;font-size:12px;color:#0369a1;margin-bottom:20px;line-height:1.6}
.btn-login{width:100%;padding:12px;font-size:14px;border-radius:10px;background:var(--primary);color:#fff;border:none;cursor:pointer;font-weight:700;margin-top:8px;transition:all .2s;}
.btn-login:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 12px var(--primary-glow)}
#login-error{color:var(--danger);font-size:12px;margin-top:8px;display:none;text-align:center}
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-brand">
    <div class="brand-logo">🎓</div>
    <h1>PlaceTrack</h1>
    <p>Professional Placement Training Portal</p>
  </div>

  <div class="login-card">
    <div class="role-tabs">
      <div class="role-tab active" id="tab-faculty" onclick="setRole('faculty')">Faculty</div>
      <div class="role-tab" id="tab-student" onclick="setRole('student')">Student</div>
    </div>

    <div class="demo-hint" id="demo-hint">
      <strong>Faculty Access:</strong> faculty@college.edu / faculty123
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Roll Number / Email</label>
        <input type="text" class="form-control" id="login-id" placeholder="Enter Roll No or Email" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" id="login-password" placeholder="••••••••" required/>
      </div>
      <div id="login-error">Invalid credentials. Please try again.</div>
      <button type="submit" class="btn-login" id="login-btn">Sign In</button>
    </form>
  </div>
</div>

<script>
let selectedRole = 'faculty';
function setRole(role) {
  selectedRole = role;
  document.getElementById('tab-faculty').classList.toggle('active', role==='faculty');
  document.getElementById('tab-student').classList.toggle('active', role==='student');
  document.getElementById('demo-hint').innerHTML = role==='faculty'
    ? '<strong>Faculty Access:</strong> faculty@college.edu / faculty123'
    : '<strong>Student Access:</strong> arjun@student.edu / student123';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = 'Verifying…'; err.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({identifier: document.getElementById('login-id').value, password: document.getElementById('login-password').value})});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    localStorage.setItem('pt_user', JSON.stringify(data.user));
    window.location.href = data.user.role === 'faculty' ? '/faculty-dashboard.html' : '/student-dashboard.html';
  } catch(e) {
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
